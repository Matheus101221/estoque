<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Lojas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Estoque Lojas</h1>
    </div>
    <div class="topbar-meta">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="last-update">atualizando...</span>
    </div>
  </header>

  <nav class="store-tabs" id="store-tabs">
    <!-- gerado via JS a partir de config.js -->
  </nav>

  <main class="content">

    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input type="text" id="search-input" placeholder="Buscar por modelo ou chassi...">
      </div>
      <div class="store-count" id="store-count">0 motos em estoque</div>
    </div>

    <div id="status-message" class="status-message" hidden></div>

    <section id="models-container" class="models-container">
      <!-- grupos de modelo gerados via JS -->
    </section>

  </main>

  <footer class="footer">
    <span>Dados sincronizados com Google Sheets</span>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
