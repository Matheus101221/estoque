<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0b">
  <title>Estoque Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonte alterada para Nunito (mais arredondada) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="eyebrow">PAINEL INTERNO</div>
          <h1>Estoque Comercial</h1>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="sync-status">
          <span class="live-dot"></span>
          <div>
            <strong>Estoque online</strong>
            <span id="last-update">Atualizando...</span>
          </div>
        </div>
        <button class="icon-btn" id="refresh-btn" title="Atualizar estoque" aria-label="Atualizar estoque">↻</button>
      </div>
    </header>



      <main class="content">
      <!-- Seções de introdução e resumo removidas -->
      
      <section class="stock-panel">
        <div class="panel-heading">
          <div>
            <span class="section-kicker">LOCALIZAÇÃO</span>
            <h3>Escolha a loja</h3>
          </div>
          <span class="availability-badge"><span></span> Disponível</span>
        </div>
        <nav class="store-tabs" id="store-tabs" aria-label="Lojas"></nav>
      </section>

      <section class="stock-panel">
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon">⌕</span>
            <input type="text" id="search-input" placeholder="Buscar modelo, cor ou chassi..." autocomplete="off">
            <button class="clear-search" id="clear-search" title="Limpar busca" aria-label="Limpar busca">×</button>
          </div>
          <div class="toolbar-right"></div>
        </div>

        <div id="status-message" class="status-message" hidden></div>
        <div class="active-store-line">
          <div>
            <span class="section-kicker">ESTOQUE ATUAL</span>
            <h3 id="active-store-title">Estoque</h3>
          </div>
          <span id="active-stock-count" class="active-stock-count">0 unidades</span>
        </div>

        <section id="models-container" class="models-container"></section>
      </section>
    </main>

    <footer class="footer">
      <span>Dados sincronizados com Google Sheets</span>
      <span>•</span>
      <span>Painel interno para vendedores</span>
    </footer>
  </div>

  <div class="modal-overlay" id="sold-modal" hidden>
    <div class="modal-box">
      <div class="modal-icon">⚠</div>
      <h3>Marcar como vendida?</h3>
      <p id="sold-modal-text"></p>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="sold-modal-cancel" type="button">Cancelar</button>
        <button class="modal-btn confirm" id="sold-modal-confirm" type="button">Marcar como vendida</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
